<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leonardo Prado Suzin. Engenheiro de Dados na Dati.">
  <defs>
    <clipPath id="frame"><rect width="900" height="240" rx="18"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9f0a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, sans-serif">
    <rect width="900" height="240" fill="#000000"/>
    <rect x="0" y="0" width="900" height="1.5" fill="url(#glow)">
      <animate attributeName="y" values="0;238;0" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </rect>

    <!-- headline -->
    <g opacity="0">
      <text x="450" y="106" text-anchor="middle" font-size="50" font-weight="600" letter-spacing="-1" fill="#f5f5f7">Leonardo Prado Suzin.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" values="0 14;0 0"/>
    </g>

    <!-- tagline -->
    <g opacity="0">
      <text x="450" y="147" text-anchor="middle" font-size="21" font-weight="400" letter-spacing="0.1" fill="#86868b">Engenheiro de Dados. Pipelines e agentes de IA na AWS.</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.45s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" dur="0.9s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" values="0 14;0 0"/>
    </g>

    <!-- caption -->
    <g opacity="0">
      <circle cx="342" cy="192" r="3.5" fill="#ff9f0a">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="356" y="197" font-size="14" font-weight="400" letter-spacing="-0.2" fill="#cccccc">Dati · Blumenau, SC · conta de trabalho</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.75s" fill="freeze"/>
    </g>
  </g>
</svg>
